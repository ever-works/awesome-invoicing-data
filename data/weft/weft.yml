name: "Weft"
description: "Time tracker and invoicing app for freelancers who bill by the hour. Runs in the browser and works offline, with no account: data stays on the user's device. Typeset PDF invoices with a payment QR code, plus XRechnung and ZUGFeRD e-invoices. Tracking is free; invoicing is a one-time purchase."
