markdown: "## Pricing\n\nFreemium. Time tracking is free; invoicing has a 30-day trial, then a one-time licence ($69 / \u20ac69) with 12 months of updates.\n\n## Links\n\n- Website: <https://wefthours.com/>\n- Demo with sample data, no sign-up: <https://wefthours.com/app/?demo=fresh>\n"
